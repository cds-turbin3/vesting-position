# What each test's auto-generated report contains and how. `cast` is the
# report-level name/address table (every alias the story registered),
# rendered once before T0; the rest are per-transaction views.
#
# The top level is the suite-wide base; an [override.<test_fn>] section
# (keyed by the bare test fn name, the same name the report file carries)
# merges over it for that one test: a key present replaces, a key absent
# inherits. Overrides resolve via the test thread's name, so they do not
# apply under `cargo test -- --test-threads=1` (frood diagnoses this).
blocks = ["cast", "sequence", "authority", "ownership", "tree"]
sequence = "lifelines"
collapse = ["tree"]

# The CU profile reads its numbers off the sequence diagram and the CPI
# tree; the cast and the authority/ownership graphs repeat what every
# other report already shows for the same transactions.
[override.compute_units_profile]
blocks = ["sequence", "tree"]
